name: Mirror to Tangled

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tangled-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TANGLED_SSH_KEY }}

      - name: Add Tangled host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan tangled.org >> ~/.ssh/known_hosts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push main to Tangled
        run: |
          git remote add tangled git@tangled.org:charlebois.info/sveltekit-atproto-starter
          git push tangled HEAD:main
